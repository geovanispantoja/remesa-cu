# Supabase gratis pausa el proyecto si pasa una semana sin uso.
# Esto le hace una consulta cada 3 días para que no se duerma.
# Necesita los secretos SUPABASE_URL y SUPABASE_ANON_KEY en
# GitHub → Settings → Secrets and variables → Actions.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar config pública
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/config_publica" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
