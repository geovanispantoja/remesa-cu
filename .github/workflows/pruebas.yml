name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Base de datos (SQL)
        run: ./pruebas/correr.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cliente JS
        run: node --test compartido/remesa-api.test.mjs
      - name: instalar_todo.sql al día
        run: |
          ./supabase/armar_instalar_todo.sh
          git diff --exit-code supabase/instalar_todo.sql || (echo "Corre ./supabase/armar_instalar_todo.sh y sube el resultado" && exit 1)

  navegador:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PostgREST y Playwright
        run: |
          mkdir -p bin && curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar xJ -C bin
          cd pruebas/navegador && npm install && npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Web de admin de punta a punta
        run: |
          POSTGREST_BIN=$PWD/bin/postgrest ./pruebas/navegador/preparar.sh
          node pruebas/navegador/admin.e2e.mjs capturas
      - name: PWA del cliente de punta a punta
        env:
          DB: remesa_dev
        run: |
          POSTGREST_BIN=$PWD/bin/postgrest ./pruebas/navegador/preparar.sh
          node pruebas/navegador/cliente.e2e.mjs capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas
