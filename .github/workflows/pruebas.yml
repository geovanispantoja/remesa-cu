name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Base de datos (SQL)
        run: ./pruebas/correr.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cliente JS
        run: node --test compartido/remesa-api.test.mjs
      - name: instalar_todo.sql al día
        run: |
          ./supabase/armar_instalar_todo.sh
          git diff --exit-code supabase/instalar_todo.sql || (echo "Corre ./supabase/armar_instalar_todo.sh y sube el resultado" && exit 1)
